<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DinoAI</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0B0E12;color:#E0E0E0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
#app{width:100%;max-width:960px;background:#14181F;border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.9);padding:24px;border:1px solid #2A3A2A}
.hidden{display:none!important}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.header{display:flex;align-items:center;gap:16px;margin-bottom:24px;border-bottom:1px solid #2A3A2A;padding-bottom:16px}
.logo{width:48px;height:48px;flex-shrink:0;background:#1B3A1B;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:6px}
.logo svg{width:100%;height:100%;fill:#4CAF50}
.header h1{font-size:1.8rem;font-weight:700;color:#4CAF50}
.header .sub{font-size:.85rem;color:#78909C;margin-left:auto;background:#1E2A2E;padding:4px 14px;border-radius:40px;border:1px solid #2A3A2A}
.btn{background:#1E2A2E;border:1px solid #2A3A2A;color:#E0E0E0;padding:10px 22px;border-radius:40px;cursor:pointer;font-weight:600;transition:.2s;font-size:.95rem}
.btn:hover{background:#2A3A3A;border-color:#3A5A3A}
.btn-primary{background:#4CAF50;color:#000;border-color:#4CAF50}
.btn-primary:hover{background:#388E3C}
.btn-danger{background:#A02020;border-color:#A02020}
.btn-danger:hover{background:#801818}
.btn-success{background:#2E7D32;border-color:#2E7D32;color:#fff}
.btn-success:hover{background:#1B5E20}
.btn-secondary{background:#1E2A2E;border-color:#2A3A2A}
.btn-sm{padding:4px 12px;font-size:.75rem;border-radius:30px}
input,textarea{width:100%;padding:12px 16px;border-radius:40px;border:1px solid #2A3A2A;background:#0B0E12;color:#E0E0E0;font-size:1rem;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:#4CAF50;box-shadow:0 0 0 3px rgba(76,175,80,.2)}
.chat-box{background:#0B0E12;border-radius:24px;padding:16px;max-height:450px;overflow-y:auto;margin:16px 0;border:1px solid #1E2A2E;display:flex;flex-direction:column;gap:4px}
.msg{padding:10px 18px;border-radius:20px;max-width:85%;word-wrap:break-word;line-height:1.5;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.user-msg{background:#1B3A1B;align-self:flex-end;margin-left:auto;color:#fff;border-bottom-right-radius:4px}
.ai-msg{background:#1A2228;align-self:flex-start;color:#D0D8E0;border-left:3px solid #4CAF50;border-bottom-left-radius:4px}
.ai-msg .code-block{background:#0B0E12;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #2A3A2A}
.ai-msg .code-block pre{margin:0;white-space:pre-wrap;font-family:'Courier New',monospace;font-size:.85rem;color:#A5D6A7}
.ai-msg .code-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
.thinking{animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
.admin-panel{background:#1A2228;border-radius:20px;padding:16px;margin:16px 0;border:1px solid #4CAF50}
.admin-panel h3{color:#4CAF50;margin-bottom:8px}
#adminOutput{background:#0B0E12;padding:12px;border-radius:16px;white-space:pre-wrap;max-height:200px;overflow-y:auto;font-size:.9rem;border:1px solid #2A3A2A}
.tariff-badge{display:inline-block;padding:4px 14px;border-radius:40px;background:#2E7D32;font-size:.75rem;font-weight:600;color:#fff;text-transform:uppercase}
.pro-badge{background:#4CAF50;color:#000}
#limitInfo{font-size:.8rem;color:#78909C;margin-top:4px}
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0}
.gen-card{background:#0B0E12;border-radius:20px;padding:16px;border:1px solid #1E2A2E}
.gen-card h3{color:#4CAF50;margin-bottom:8px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.gen-card .counter{color:#78909C;font-size:.8rem}
.gen-output{margin-top:12px;padding:12px;background:#0B0E12;border-radius:16px;max-height:250px;overflow-y:auto;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid #1E2A2E}
.gen-output img,.gen-output canvas,.gen-output video{max-width:100%;max-height:200px;border-radius:12px;margin:4px 0}
#authSection{text-align:center;padding:60px 20px}
#authSection .logo-big{width:120px;height:120px;margin:0 auto 20px}
#authSection .logo-big svg{width:100%;height:100%;fill:#4CAF50}
#authSection h2{font-size:2.5rem;color:#4CAF50;margin-bottom:12px;font-weight:700}
#authSection p{color:#78909C;margin-bottom:28px;font-size:1.1rem}
#authStatus{margin-top:16px;color:#B0BEC5}
@media (max-width:600px){.gen-grid{grid-template-columns:1fr}.header h1{font-size:1.4rem}}
</style>
</head>

function generateVideo(prompt){if(!currentUser){appendMessage('DinoAI','Сначала войдите.');return}if(tariff!=='pro'&&(userData.videoUsed||0)>=2){appendMessage('DinoAI','Лимит видео исчерпан.');return}if(!prompt.trim())prompt='анимация';const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const ctx=canvas.getContext('2d');let frame=0,totalFrames=120,seed=prompt.length+prompt.charCodeAt(0)*13,rng=s=>{s=Math.sin(s)*43758.5453123;return s-Math.floor(s)};function drawFrame(){frame++;if(frame>totalFrames)return;const progress=frame/totalFrames,hueBase=(seed+progress*180)%360,grad=ctx.createLinearGradient(0,0,640,360);grad.addColorStop(0,`hsl(${hueBase},80%,50%)`);grad.addColorStop(1,`hsl(${(hueBase+60)%360},70%,30%)`);ctx.fillStyle=grad;ctx.fillRect(0,0,640,360);const count=8+Math.floor(rng(seed+1)*8);for(let i=0;i<count;i++){const angle=(i/count)*Math.PI*2+progress*2+(rng(seed+i*3)*0.5),radius=80+Math.sin(progress*4+i*1.5)*40,x=320+Math.cos(angle)*radius,y=180+Math.sin(angle)*radius*0.6,size=15+Math.sin(progress*3+i*1.2)*10;ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fillStyle=`hsla(${(hueBase+i*30+progress*50)%360},90%,70%,0.7)`;ctx.fill()}ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(prompt.substring(0,20),320,180);if(frame<totalFrames)requestAnimationFrame(drawFrame)}videoOutput.innerHTML='';videoOutput.appendChild(canvas);drawFrame();if(tariff!=='pro'){userData.videoUsed=(userData.videoUsed||0)+1;updateUserData(currentUser.uid,{videoUsed:userData.videoUsed});updateUI()}appendMessage('DinoAI','🎬 Видео-анимация создана.')}
function getSmartResponse(query){const lower=query.toLowerCase();try{const mathMatch=query.match(/^([\d+\-*/().%^,sqrtπe ]+)$/i);if(mathMatch){let evalStr=mathMatch[1].replace(/π/gi,'Math.PI').replace(/e(?![xp])/gi,'Math.E').replace(/sqrt/gi,'Math.sqrt').replace(/sin/gi,'Math.sin').replace(/cos/gi,'Math.cos').replace(/tan/gi,'Math.tan').replace(/log/gi,'Math.log10').replace(/ln/gi,'Math.log').replace(/abs/gi,'Math.abs');if(/^[\d+\-*/().%^,Math.sincosPIE ]+$/.test(evalStr.replace(/Math\.\w+/g,''))){const result=Function(`"use strict"; return (${evalStr})`)();if(typeof result==='number'&&isFinite(result))return`Результат: ${result}`}}}catch(e){}if(lower.includes('время')||lower.includes('который час'))return`Сейчас ${new Date().toLocaleTimeString('ru-RU')}`;if(lower.includes('создатель')||lower.includes('автор'))return'Меня создал Gothbreach (cookieusergg). Я – универсальный ИИ.';const codeTriggers=['напиши','сделай','создай','код','программа','сайт','скрипт','функция','класс'];const isCodeRequest=codeTriggers.some(t=>lower.includes(t))&&(lower.includes('html')||lower.includes('css')||lower.includes('js')||lower.includes('python')||lower.includes('php')||lower.includes('java')||lower.includes('сайт')||lower.includes('программ')||lower.includes('скрипт'));if(isCodeRequest){let lang='javascript';if(lower.includes('python'))lang='python';else if(lower.includes('html'))lang='html';else if(lower.includes('css'))lang='css';else if(lower.includes('php'))lang='php';else if(lower.includes('java'))lang='java';let code='',explanation='';if(lower.includes('сайт')||lower.includes('html')){code='<!DOCTYPE html>\n<html>\n<head>\n    <title>Мой сайт</title>\n    <style>\n        body { font-family: Arial; background: #0B0E12; color: #E0E0E0; }\n        h1 { color: #4CAF50; }\n    </style>\n</head>\n<body>\n    <h1>Привет, мир!</h1>\n    <p>Это сайт, созданный DinoAI.</p>\n    <script>\n        console.log("Сайт работает!");\n    <\/script>\n</body>\n</html>';explanation='Базовый HTML-документ с CSS и JS.'}else if(lower.includes('python')){code='# Простой скрипт на Python\nprint("Привет, мир!")\nfor i in range(5):\n    print(f"Шаг {i+1}")';explanation='Базовый скрипт Python.'}else if(lower.includes('css')){code='/* Стили для сайта */\nbody {\n    background: #0B0E12;\n    color: #E0E0E0;\n    font-family: \'Segoe UI\', sans-serif;\n}\nh1 {\n    color: #4CAF50;\n    text-shadow: 0 0 8px rgba(76,175,80,0.3);\n}\n.btn {\n    background: #4CAF50;\n    border: none;\n    padding: 10px 20px;\n    border-radius: 40px;\n    color: #000;\n    cursor: pointer;\n}';explanation='CSS-стили.'}else if(lower.includes('php')){code='<?php\n$name = "DinoAI";\necho "Привет, $name!";\n?>';explanation='PHP-скрипт.'}else{code='// Простая программа на JavaScript\nfunction greet(name) {\n    return `Привет, ${name}!`;\n}\nconsole.log(greet("DinoAI"));';explanation='Функция на JavaScript.'}return`📄 **Код (${lang})**\n\n${code}\n\n💡 ${explanation}`}if(lower.match(/^(привет|здравствуй|hello|hi|hey)/))return'Привет! Я DinoAI, универсальный ИИ. Задавайте любые вопросы.';if(lower.includes('спасиб')||lower.includes('благодарю'))return'Всегда пожалуйста! Обращайтесь ещё.';if(lower.includes('что ты умеешь')||lower.includes('твои возможности'))return'Я умею: писать код (сайты, программы), генерировать фото и видео, отвечать на вопросы, решать математику. В Pro-тарифе мои ответы более детальные и развёрнутые.';if(tariff==='pro'){const proResponses=['Отличный вопрос! Давайте разберём его подробно. Во-первых, стоит отметить, что... (здесь идёт глубокий анализ). Кроме того, я бы рекомендовал рассмотреть альтернативные подходы, такие как... Наконец, не забывайте про оптимизацию и тестирование.','Я вижу, что вы затронули важную тему. В рамках Pro-доступа я могу предоставить вам полный спектр решений: от базовой архитектуры до продвинутых техник. Например, вы можете использовать следующий паттерн... Также стоит учесть факторы масштабирования.','Это сложная задача, но я помогу вам. Мой гибридный интеллект (Claude+ChatGPT+Gemini+Grok) позволяет предложить комплексный план: 1) анализ требований, 2) проектирование, 3) реализация, 4) тестирование. Давайте начнём с первого шага.','С удовольствием отвечу на ваш вопрос. В Pro-режиме я имею доступ к расширенной базе знаний. Мой ответ будет включать: теоретическую основу, практические примеры и рекомендации по внедрению. Вот что я предлагаю...'];return proResponses[Math.floor(Math.random()*proResponses.length)]}else{const freeResponses=['Хороший вопрос. Мой ответ: нужно подумать и выбрать оптимальное решение.','Я бы посоветовал действовать последовательно. Начните с малого.','Это зависит от контекста. Если уточните, я смогу дать более точный ответ.','В общем случае, лучше использовать проверенные методы. Попробуйте поискать информацию в открытых источниках.'];return freeResponses[Math.floor(Math.random()*freeResponses.length)]}}
async function askAI(prompt){const thinkingDiv=appendThinking();await new Promise(resolve=>setTimeout(resolve,800+Math.random()*1e3));thinkingDiv.remove();const reply=getSmartResponse(prompt);const isCode=reply.includes('```')||reply.includes('📄 **Код**');if(isCode){let code=reply;if(reply.includes('```')){const lines=reply.split('\n');let inCode=!1,codeLines=[];for(const line of lines){if(line.includes('```')){inCode=!inCode;continue}if(inCode)codeLines.push(line)}code=codeLines.join('\n')}else if(reply.includes('📄 **Код**')){const parts=reply.split('\n');let start=!1,codeParts=[];for(const line of parts){if(line.includes('💡'))break;if(start&&line.trim()!=='')codeParts.push(line);if(line.includes('```'))start=!0}code=codeParts.join('\n')}if(code.trim()){const explanation=reply.includes('💡')?reply.split('💡')[1]:'';if(explanation){const expDiv=document.createElement('div');expDiv.className='msg ai-msg';expDiv.textContent='💡 '+explanation.trim();chatBox.appendChild(expDiv);chatBox.scrollTop=chatBox.scrollHeight}appendMessage('DinoAI',code.trim(),!0);return}}appendMessage('DinoAI',reply)}
googleLoginBtn.onclick=function(){const provider=new firebase.auth.GoogleAuthProvider();auth.signInWithRedirect(provider)};auth.getRedirectResult().catch(error=>{authStatus.textContent='Ошибка входа: '+error.message});auth.onAuthStateChanged(async user=>{if(user){currentUser=user;authSection.classList.add('hidden');mainApp.classList.remove('hidden');userData=await fetchUserData(user.uid);isAdmin=user.email===ADMIN_EMAIL;if(isAdmin&&userData.tariff!=='pro'){userData.tariff='pro';await updateUserData(user.uid,{tariff:'pro'});userData=await fetchUserData(user.uid)}updateUI();appendMessage('DinoAI',`Добро пожаловать, ${user.displayName||user.email}! Тариф: ${tariff}. В Pro-режиме я даю более детальные ответы.`)}else{currentUser=null;userData=null;isAdmin=!1;authSection.classList.remove('hidden');mainApp.classList.add('hidden');adminPanel.classList.add('hidden');authStatus.textContent=''}});logoutBtn.onclick=function(){auth.signOut();chatBox.innerHTML=''};sendBtn.onclick=async function(){const text=userInput.value.trim();if(!text)return;appendMessage('Вы',text);userInput.value='';await askAI(text)};userInput.addEventListener('keydown',function(e){if(e.key==='Enter')sendBtn.click()});startCmdBtn.onclick=function(){appendMessage('DinoAI','🦕 Я – DinoAI, универсальный ИИ. Умею писать код, генерировать фото/видео, отвечать на вопросы. В Pro-тарифе мои ответы максимально детальные и развёрнутые.')};genPhotoBtn.onclick=function(){generatePhoto(photoPrompt.value||'красивый пейзаж')};genVideoBtn.onclick=function(){generateVideo(videoPrompt.value||'анимация')};console.log('DinoAI универсальный загружен. Тариф:',tariff);
